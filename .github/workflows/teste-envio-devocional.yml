name: Teste envio devocional

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/teste-envio-devocional.yml"

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar os arquivos
        uses: actions/checkout@v4

      - name: Preparar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Testar envio da palavra do dia
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: node scripts/enviar-devocional.mjs
